spring.application.name=autoshop
server.servlet.context-path=/autoshop
jwt.key=YzEyMzR0bXZxQzRmNTZ2cEFoUGVpMWdIajU3aWdoZ2g
# DB config
spring.datasource.url=jdbc:postgresql://localhost:5432/autoshop
spring.datasource.username=postgres
spring.datasource.password=7906
spring.sql.init.mode=always
# Hibernate/JPA config
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
springdoc.swagger-ui.tagsSorter=alpha

# SMTP configuration (override with environment variables outside local development)
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}
autoshop.mail.from=${SMTP_FROM:no-reply@autoshop.local}
